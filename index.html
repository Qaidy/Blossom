    <style type="text/tailwindcss">
      @layer components {
        .btn {
          @apply bg-primary text-background text-sm font-medium tracking-widest uppercase h-12 px-8 rounded-full inline-flex items-center justify-center gap-2 transition-all duration-300 hover:bg-terra active:scale-95 cursor-pointer disabled:opacity-50;

        }
        .inp {

        }
        .lbl {
          @apply text-[10px] font-semibold uppercase tracking-widest text-text-secondary;

        }

        }
        .msub {
          @apply block px-10 py-3 text-sm text-text-secondary normal-case tracking-normal border-b border-border/60 hover:text-primary hover:bg-surface text-left w-full;
        }
        .mbadge {

    <style>
      html {
        scroll-behavior: smooth;
      }
      body {
        background: #f9f8f4;
        color: #2d3a31;
        overflow-x: hidden;
      }
      ::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }
      ::-webkit-scrollbar-track {
        background: #f9f8f4;
      }
      ::-webkit-scrollbar-thumb {
        background: #dccfc2;
        border-radius: 9999px;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      body * {
        transition-timing-function: cubic-bezier(0.22, 1, 0.36, 1);
      }
      .inp:focus {
        border-color: #8c9a84;
        box-shadow: 0 0 0 2px rgba(140, 154, 132, 0.25);
      }
      :focus-visible {
        outline: 2px solid #8c9a84;
        outline-offset: 2px;
      }
      .arch {
        border-radius: 200px 200px 24px 24px;
      }
      @media (min-width: 768px) {
        .stagger > *:nth-child(even) {
          margin-top: 3rem;
        }
        .stagger {
          align-items: start;
        }
      }
      .reveal {
        opacity: 0;
        transform: translateY(1rem);
        transition:
          opacity 0.8s ease-out,
          transform 0.8s ease-out;
      }
      .reveal.in {
        opacity: 1;
        transform: none;
      }
      h1 em,
      h2 em {
        font-style: italic;
        font-weight: 400;
        color: #8c9a84;
      }
      #mobile-nav {
        animation: navIn 0.25s ease-out;
      }
      @keyframes navIn {
        from {
          opacity: 0;
          transform: translateY(-8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @media (max-width: 639px) {
        .sec {
          padding: 3rem 1rem;
        }
        #app h1 {
          font-size: clamp(2rem, 9vw, 3rem);
        }
        #app h2.h2,
        #app h3.h2 {
          font-size: clamp(1.65rem, 7vw, 2.25rem);
        }
        #app .btn,
        #app .btn-o {
          padding-inline: 1.25rem;
        }
        #app .rounded-xl.p-8 {
          padding: 1.25rem;
        }
        footer {
          padding: 3rem 1rem;
        }
        footer .flex.gap-6 {
          flex-wrap: wrap;
          justify-content: center;
          gap: 1rem;
        }
      }
      @media (hover: none) {
        .card .group > div {
          opacity: 1;
        }
      }
    </style>

      function closeMobileNav() {
        setNavOpen(false);

        setNavOpen($("mobile-nav").classList.contains("hidden"));

            await router();
        } catch (e) {
          showToast(e.message, "error");
        }
      }
      async function addToCart(pid) {
        if (!currentUser)
          return needLogin("Please login to add items to your cart");
        try {
          const ex = cartItems.find((i) => i.product_id === pid);
          if (ex) {
            const { data, error } = await db
              .from("carts")
              .update({ quantity: ex.quantity + 1 })
              .eq("id", ex.id)
              .select("*, products(*)")
              .single();
            if (error) throw error;
            ex.quantity = data.quantity;
            showToast("Updated item quantity in cart");
          } else {
            const { data, error } = await db
              .from("carts")
              .insert({ user_id: currentUser.id, product_id: pid, quantity: 1 })
              .select("*, products(*)")
              .single();
            if (error) throw error;
            cartItems.push(data);
            showToast("Item added to cart!");
          }
          updateGlobalCounters();
        } catch (e) {
          showToast(e.message, "error");
        }
      }
      async function updateCartQty(id, q) {
        if (q < 1) return deleteCartItem(id);
        try {
          const { data, error } = await db
            .from("carts")
            .update({ quantity: q })
            .eq("id", id)
            .select("*, products(*)")
            .single();
          if (error) throw error;
          const it = cartItems.find((i) => i.id === id);
          if (it) it.quantity = data.quantity;
          updateGlobalCounters();
          await router();
        } catch (e) {
          showToast(e.message, "error");
        }
      }
      async function deleteCartItem(id) {
        try {
          const { error } = await db.from("carts").delete().eq("id", id);
          if (error) throw error;
          cartItems = cartItems.filter((i) => i.id !== id);
          showToast("Removed item from cart");
          updateGlobalCounters();
          await router();
        } catch (e) {
          showToast(e.message, "error");
        }
      }
      async function handleCheckout() {
        try {
          const { error } = await db
            .from("carts")
            .delete()
            .eq("user_id", currentUser.id);
          if (error) throw error;
          cartItems = [];
          showToast("Order placed! Thank you for choosing Blossom.");
          updateGlobalCounters();
          location.hash = "/";
        } catch (e) {
          showToast(e.message, "error");
        }
      }

      /* ---------- ADMIN ACTIONS ---------- */
      async function handleAddProduct(e) {
        e.preventDefault();
        const b = $("add-prod-btn");
        b.disabled = true;
        b.textContent = "Publishing...";
        const price = parseFloat($("p-price").value),
          disc = parseInt($("p-discount").value) || 0;
        const row = {
          name: $("p-name").value,
          category: $("p-category").value,
          price:
            disc > 0
              ? parseFloat((price * (1 - disc / 100)).toFixed(2))
              : price,
          original_price: disc > 0 ? price : null,
          discount_percent: disc,
          image_url: $("p-image").value,
          is_best_seller: $("p-best").checked,
        };
        try {
          const { error } = await db.from("products").insert(row);
          if (error) throw error;
          showToast("Product published successfully!");
          await router();
        } catch (err) {
          showToast(err.message, "error");
          b.disabled = false;
          b.textContent = "Publish Item";
        }
      }
      function deleteProduct(id) {
        showConfirmModal(
          "Are you sure you want to permanently delete this product from the Blossom catalog?",
          async () => {
            try {
              const { error } = await db.from("products").delete().eq("id", id);
              if (error) throw error;
              showToast("Product deleted successfully");
              await router();
            } catch (e) {
              showToast(e.message, "error");
            }
          },
        );
      }
    </script>
  </body>
</html>
